name: Fill Jibun Address

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill-jibun:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install requests

      - name: Fill Jibun
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          python fill_jibun_address.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/*.json

          git diff --cached --quiet || git commit -m "Fill missing jibun addresses"

          git push
