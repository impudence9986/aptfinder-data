name: Update AptFinder DB

on:
  schedule:
    - cron: "17 16 * * *"   # 매일 한국시간 새벽 1시 17분

  workflow_dispatch:
    inputs:
      force_phase:
        description: "auto, main, repair, verify"
        required: false
        default: "auto"

      max_runtime_minutes:
        description: "GitHub Actions 안전 정지 시간(분)"
        required: false
        default: "330"

permissions:
  contents: write
  actions: read

concurrency:
  group: aptfinder-db-update
  cancel-in-progress: false

jobs:
  update-db:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Decide AptFinder phase
        id: decide
        run: |
          set -e

          FORCE_PHASE="${{ github.event.inputs.force_phase }}"
          if [ -z "$FORCE_PHASE" ]; then FORCE_PHASE="auto"; fi

          PHASE="main"

          if [ "$FORCE_PHASE" = "main" ]; then
            PHASE="main"
          elif [ "$FORCE_PHASE" = "repair" ]; then
            PHASE="repair"
          elif [ "$FORCE_PHASE" = "verify" ]; then
            PHASE="verify"
          else
            # 메인 전국 수집이 남아 있으면 무조건 main 우선
            if [ -f "update_state.json" ]; then
              REMAINING=$(python -c "import json; print(len(json.load(open('update_state.json', encoding='utf-8')).get('remaining', [])))" 2>/dev/null || echo "0")
              if [ "$REMAINING" -gt 0 ]; then
                PHASE="main"
              else
                PHASE="repair"
              fi
            elif [ -f ".aptfinder_phase.json" ]; then
              PHASE=$(python -c "import json; print(json.load(open('.aptfinder_phase.json', encoding='utf-8')).get('phase','main'))" 2>/dev/null || echo "main")
            fi

            if [ "$PHASE" = "main" ]; then
              true
            else
              NAVER_PENDING=0
              if [ -f "data/_naver_queue.json" ]; then
                NAVER_PENDING=$(python -c "import json; print(len(json.load(open('data/_naver_queue.json', encoding='utf-8')).get('pending', [])))" 2>/dev/null || echo "0")
              fi

              REPAIR_PENDING=0
              if [ -f "data/_repair_queue.json" ]; then
                REPAIR_PENDING=$(python -c "import json; print(len(json.load(open('data/_repair_queue.json', encoding='utf-8')).get('pending', [])))" 2>/dev/null || echo "0")
              fi

              VERIFY_PENDING=0
              if [ -f "data/_verify_queue.json" ]; then
                VERIFY_PENDING=$(python -c "import json; print(len(json.load(open('data/_verify_queue.json', encoding='utf-8')).get('pending', [])))" 2>/dev/null || echo "0")
              fi

              if [ "$NAVER_PENDING" -gt 0 ] || [ "$REPAIR_PENDING" -gt 0 ]; then
                PHASE="repair"
              elif [ "$VERIFY_PENDING" -gt 0 ]; then
                PHASE="verify"
              fi
            fi
          fi

          echo "Selected phase: $PHASE"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"

      - name: Run main nationwide DB collection
        if: steps.decide.outputs.phase == 'main'
        env:
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_DAILY_QUOTA: "100000"
          KAKAO_RESERVED_FOR_APP: "500"
          NAVER_DAILY_QUOTA: "25000"
          NAVER_RESERVED_FOR_APP: "1000"
          APTFINDER_SCAN_PROFILE: "balanced"
        run: |
          set -e

          MAX_RUNTIME_MINUTES="${{ github.event.inputs.max_runtime_minutes }}"
          if [ -z "$MAX_RUNTIME_MINUTES" ]; then MAX_RUNTIME_MINUTES="330"; fi

          echo "PHASE=main"
          echo "MAX_RUNTIME_MINUTES=$MAX_RUNTIME_MINUTES"

          python -u scripts/generate_aptfinder_db.py \
            --region-group today \
            --resume \
            --force \
            --max-runtime-minutes "$MAX_RUNTIME_MINUTES"

          if [ ! -f "update_state.json" ]; then
            echo "Main completed. Switch to repair."
            python -c "import json; from datetime import datetime; json.dump({'phase':'repair','updatedAt':datetime.now().strftime('%Y-%m-%d %H:%M:%S'),'reason':'main_completed'}, open('.aptfinder_phase.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
          else
            echo "Main still running. Keep main."
            python -c "import json; from datetime import datetime; json.dump({'phase':'main','updatedAt':datetime.now().strftime('%Y-%m-%d %H:%M:%S'),'reason':'main_still_running'}, open('.aptfinder_phase.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
          fi

      - name: Run repair queues only
        if: steps.decide.outputs.phase == 'repair'
        env:
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_DAILY_QUOTA: "100000"
          KAKAO_RESERVED_FOR_APP: "500"
          NAVER_DAILY_QUOTA: "25000"
          NAVER_RESERVED_FOR_APP: "1000"
          APTFINDER_SCAN_PROFILE: "balanced"
        run: |
          set -e

          save_progress() {
            echo "Save AptFinder progress."

            git config user.name "aptfinder-bot"
            git config user.email "aptfinder-bot@users.noreply.github.com"
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

            # 존재하는 파일은 추가하고, Git에서 삭제된 추적 파일도 정상 반영합니다.
            git add -A -- data metadata.json .aptfinder_phase.json
            if [ -e "update_state.json" ] || git ls-files --error-unmatch update_state.json >/dev/null 2>&1; then
              git add -A -- update_state.json
            fi

            if ! git diff --cached --quiet; then
              git commit -m "Auto save AptFinder progress"

              for i in 1 2 3; do
                echo "Intermediate push attempt $i..."
                git pull --rebase origin "$GITHUB_REF_NAME" || true

                if git push origin HEAD:"$GITHUB_REF_NAME"; then
                  echo "Intermediate push success."
                  break
                fi

                if [ "$i" -eq 3 ]; then
                  echo "Intermediate push failed after 3 attempts."
                  return 1
                fi

                echo "Intermediate push failed. Retrying in 10 seconds..."
                sleep 10
              done
            else
              echo "No intermediate changes to commit."
            fi
          }

          echo "PHASE=repair"

          NAVER_PENDING=0
          if [ -f "data/_naver_queue.json" ]; then
            NAVER_PENDING=$(python -c "import json; print(len(json.load(open('data/_naver_queue.json', encoding='utf-8')).get('pending', [])))" 2>/dev/null || echo "0")
          fi

          echo "NAVER_PENDING=$NAVER_PENDING"

          if [ "$NAVER_PENDING" -gt 0 ]; then
            python -u scripts/generate_aptfinder_db.py \
              --naver-queue-only \
              --max-naver-queue-items 500 \
              --max-runtime-minutes 80

            NAVER_LEFT=0
            if [ -f "data/_naver_queue.json" ]; then
              NAVER_LEFT=$(python -c "import json; print(len(json.load(open('data/_naver_queue.json', encoding='utf-8')).get('pending', [])))" 2>/dev/null || echo "0")
            fi

            echo "NAVER_LEFT=$NAVER_LEFT"

            if [ "$NAVER_LEFT" -gt 0 ]; then
              echo "Naver queue still remains. Keep repair and skip repair queue for this run."
              python -c "import json; from datetime import datetime; json.dump({'phase':'repair','updatedAt':datetime.now().strftime('%Y-%m-%d %H:%M:%S'),'reason':'naver_queue_still_running'}, open('.aptfinder_phase.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
              save_progress
              exit 0
            fi

            echo "Naver queue completed in this run. Save and stop before repair queue."
            python -c "import json; from datetime import datetime; json.dump({'phase':'repair','updatedAt':datetime.now().strftime('%Y-%m-%d %H:%M:%S'),'reason':'naver_queue_completed_wait_next_run'}, open('.aptfinder_phase.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
            save_progress
            exit 0
          else
            echo "No naver queue pending. Continue to repair queue."
          fi

          echo "Build repair queue."
          python -u scripts/generate_aptfinder_db.py \
            --build-repair-queue \
            --max-runtime-minutes 25

          REPAIR_PENDING=0
          if [ -f "data/_repair_queue.json" ]; then
            REPAIR_PENDING=$(python -c "import json; print(len(json.load(open('data/_repair_queue.json', encoding='utf-8')).get('pending', [])))" 2>/dev/null || echo "0")
          fi

          echo "REPAIR_PENDING=$REPAIR_PENDING"

          if [ "$REPAIR_PENDING" -gt 0 ]; then
            python -u scripts/generate_aptfinder_db.py \
              --repair-queue-only \
              --max-repair-items 300 \
              --max-repair-per-region 30 \
              --max-runtime-minutes 60

            REPAIR_LEFT=0
            if [ -f "data/_repair_queue.json" ]; then
              REPAIR_LEFT=$(python -c "import json; print(len(json.load(open('data/_repair_queue.json', encoding='utf-8')).get('pending', [])))" 2>/dev/null || echo "0")
            fi

            echo "REPAIR_LEFT=$REPAIR_LEFT"

            if [ "$REPAIR_LEFT" -gt 0 ]; then
              echo "Repair queue still remains. Keep repair and stop this run."
              python -c "import json; from datetime import datetime; json.dump({'phase':'repair','updatedAt':datetime.now().strftime('%Y-%m-%d %H:%M:%S'),'reason':'repair_still_running'}, open('.aptfinder_phase.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
              save_progress
              exit 0
            fi

            echo "Repair queue completed in this run. Save and stop before verify queue."
            python -c "import json; from datetime import datetime; json.dump({'phase':'repair','updatedAt':datetime.now().strftime('%Y-%m-%d %H:%M:%S'),'reason':'repair_queue_completed_wait_next_run'}, open('.aptfinder_phase.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
            save_progress
            exit 0
          else
            echo "No repair queue pending."
          fi

          echo "Repair completed. Build verify queue and switch to verify if needed."
          python -u scripts/generate_aptfinder_db.py \
            --build-verify-queue \
            --max-runtime-minutes 30

          VERIFY_PENDING=0
          if [ -f "data/_verify_queue.json" ]; then
            VERIFY_PENDING=$(python -c "import json; print(len(json.load(open('data/_verify_queue.json', encoding='utf-8')).get('pending', [])))" 2>/dev/null || echo "0")
          fi

          echo "VERIFY_PENDING=$VERIFY_PENDING"

          if [ "$VERIFY_PENDING" -gt 0 ]; then
            python -c "import json; from datetime import datetime; json.dump({'phase':'verify','updatedAt':datetime.now().strftime('%Y-%m-%d %H:%M:%S'),'reason':'repair_completed_verify_pending'}, open('.aptfinder_phase.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
          else
            python -c "import json; from datetime import datetime; json.dump({'phase':'main','updatedAt':datetime.now().strftime('%Y-%m-%d %H:%M:%S'),'reason':'repair_completed_no_verify_pending'}, open('.aptfinder_phase.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
          fi

      - name: Run K-apt single phone verification queue
        if: steps.decide.outputs.phase == 'verify'
        env:
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_DAILY_QUOTA: "100000"
          KAKAO_RESERVED_FOR_APP: "500"
          NAVER_DAILY_QUOTA: "25000"
          NAVER_RESERVED_FOR_APP: "1000"
          APTFINDER_SCAN_PROFILE: "balanced"
        run: |
          set -e

          echo "PHASE=verify"

          VERIFY_PENDING=0
          if [ -f "data/_verify_queue.json" ]; then
            VERIFY_PENDING=$(python -c "import json; print(len(json.load(open('data/_verify_queue.json', encoding='utf-8')).get('pending', [])))" 2>/dev/null || echo "0")
          fi

          echo "VERIFY_PENDING=$VERIFY_PENDING"

          if [ "$VERIFY_PENDING" -gt 0 ]; then
            python -u scripts/generate_aptfinder_db.py \
              --verify-queue-only \
              --max-verify-items 700 \
              --max-verify-per-region 60 \
              --max-runtime-minutes 260
          else
            echo "No verify queue pending."
          fi

          VERIFY_LEFT=0
          if [ -f "data/_verify_queue.json" ]; then
            VERIFY_LEFT=$(python -c "import json; print(len(json.load(open('data/_verify_queue.json', encoding='utf-8')).get('pending', [])))" 2>/dev/null || echo "0")
          fi

          echo "VERIFY_LEFT=$VERIFY_LEFT"

          if [ "$VERIFY_LEFT" -eq 0 ]; then
            echo "Verify completed. Switch to main."
            python -c "import json; from datetime import datetime; json.dump({'phase':'main','updatedAt':datetime.now().strftime('%Y-%m-%d %H:%M:%S'),'reason':'verify_completed'}, open('.aptfinder_phase.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
          else
            echo "Verify still running. Keep verify."
            python -c "import json; from datetime import datetime; json.dump({'phase':'verify','updatedAt':datetime.now().strftime('%Y-%m-%d %H:%M:%S'),'reason':'verify_still_running'}, open('.aptfinder_phase.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)"
          fi

      - name: Upload generated files as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aptfinder-generated-files
          path: |
            data/
            metadata.json
            update_state.json
            .aptfinder_phase.json
          retention-days: 7

      - name: Commit and push changes
        run: |
          set -e

          git config user.name "aptfinder-bot"
          git config user.email "aptfinder-bot@users.noreply.github.com"

          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

          BRANCH="${GITHUB_REF_NAME}"
          echo "Current branch: $BRANCH"

          # 존재하는 파일은 추가하고, Git에서 삭제된 추적 파일도 정상 반영합니다.
          git add -A -- data metadata.json .aptfinder_phase.json
          if [ -e "update_state.json" ] || git ls-files --error-unmatch update_state.json >/dev/null 2>&1; then
            git add -A -- update_state.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto update AptFinder DB"

          for i in 1 2 3; do
            echo "Push attempt $i..."

            git pull --rebase origin "$BRANCH" || true

            if git push origin HEAD:"$BRANCH"; then
              echo "Push success."
              exit 0
            fi

            echo "Push failed. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Push failed after 3 attempts."
          exit 1
