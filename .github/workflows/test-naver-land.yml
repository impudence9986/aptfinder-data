name: Test Naver Land

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Naver Land test
        run: |
          python test_naver_land_api.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-land-test-result
          path: naver_land_test_result.json
